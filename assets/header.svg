<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="'Segoe UI',-apple-system,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="gname" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#3fb950;#58a6ff" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#3fb950">
        <animate attributeName="stop-color" values="#3fb950;#58a6ff;#bc8cff;#3fb950" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="type">
      <rect x="0" y="0" width="0" height="40">
        <animate attributeName="width" values="0;640" dur="5s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="320" fill="url(#bg)"/>

  <g opacity="0.14">
    <circle cx="200" cy="90" r="70" fill="#58a6ff">
      <animateTransform attributeName="transform" type="translate" values="0 0;60 0;0 0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="720" cy="240" r="90" fill="#bc8cff">
      <animateTransform attributeName="transform" type="translate" values="0 0;-50 -10;0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="70" r="40" fill="#3fb950">
      <animateTransform attributeName="transform" type="translate" values="0 0;40 15;0 0" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="60" y="140" font-size="64" font-weight="800" fill="url(#gname)">Avres</text>
  <text x="62" y="180" font-size="20" fill="#8b949e">@Shinzzyak</text>

  <g clip-path="url(#type)">
    <text x="60" y="235" font-size="24" font-family="'Cascadia Mono','Courier New',monospace" fill="#c9d1d9">Building AI gateways, automation &amp; Deutschup</text>
  </g>
  <rect x="694" y="207" width="3" height="26" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <rect x="60" y="262" width="0" height="4" rx="2" fill="#bc8cff">
    <animate attributeName="width" values="0;780" dur="2.5s" begin="1s" fill="freeze"/>
  </rect>

  <g>
    <path fill="#1f6feb" opacity="0.25" d="M0,300 C120,272 260,328 400,300 C540,272 680,328 900,290 L900,320 L0,320 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-60 0;0 0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path fill="#1f6feb" opacity="0.18" d="M0,312 C140,284 300,336 460,310 C620,284 780,336 900,306 L900,320 L0,320 Z">
      <animateTransform attributeName="transform" type="translate" values="-60 0;0 0;-60 0" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>